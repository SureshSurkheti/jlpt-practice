  <body class="about-page">
    <header class="site-header">
      <div class="container nav-wrap">

        <div class="nav-tools">
          <label class="language-select">
            <span data-i18n="lang.label">Language</span>
            <select id="languageSelect" aria-label="Language" data-i18n-attr="aria-label:lang.label">
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ne">नेपाली</option>

    <main class="container page-shell">
      <section class="page-intro about-intro">
        <h1 data-i18n="about.title"></h1>
        <p data-i18n="about.body"></p>
      </section>

      <!-- Two paragraphs, because two is what the page is for: what a paper
           does here, and what happens to your answers. What used to be p3 -
           which services the audio and the diagrams come from - is a caveat
           about how the site is put together, so it sits with the notices
           below rather than in the middle of the prose. p4 was a count of the
           words, kanji and languages, which the study page already draws as a
           table and draws better.

           The prose used to run down the left with the notices in a column
           beside it, which was right when there were five paragraphs of it.
           At two the left column was mostly empty and the page came out
           taller than before the cut. So the prose leads at full width, and
           the notices sit underneath it in two columns of fine print: an
           About page a reader can finish, with nothing removed from it. -->
      <section class="about-plain about-lede">
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
      </section>

      <!-- Fine print, in two columns under the prose: how the site is put
           together and what it is built from on the left, the rights notice
           on the right. Nothing here is optional - the JMdict and KANJIDIC
           attributions are a condition of CC BY-SA, and the takedown notice
           is the site's own undertaking - so the work was to make them read
           as notices rather than as the body of the page. -->
      <div class="about-notices">
        <div class="about-notes-col">
          <section class="about-plain about-hosting">
            <p data-i18n="about.p3"></p>
          </section>

          <section class="about-plain about-credits">
            <h2 data-i18n="about.creditsTitle"></h2>
            <p data-i18n="about.creditsCode"></p>
            <p data-i18n-html="about.creditsWords"></p>
            <p data-i18n-html="about.creditsKanji"></p>
            <p data-i18n="about.creditsExams"></p>
          </section>
        </div>

        <!-- Stated plainly, in one place, in English so a rights holder can
             read it: what is here, whose it is, that nothing is earned from
             it, and exactly how to have it removed. A visible route to ask is
             the difference between an email and an escalation. -->
        <section class="about-plain about-rights" id="rights">
          <h2 data-i18n="about.rightsTitle"></h2>
          <p data-i18n="about.rightsBody"></p>
          <p data-i18n-html="about.rightsRemove"></p>
          <p data-i18n="about.rightsOfficial"></p>
          <p>
            <a class="text-link" href="https://www.jlpt.jp/e/samples/forlearners.html"
               target="_blank" rel="noopener">jlpt.jp — official sample questions</a>
          </p>
        </section>
      </div>

    </main>
