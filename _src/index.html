<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#112d4e" />
    <title>JLPT Practice — Free Mock Exams for N1, N2, N3, N4 and N5</title>
    <meta name="description" content="Free JLPT mock exams with a timer, automatic marking, answer explanations and listening scripts. Practise vocabulary, grammar, reading and listening from N5 up to N1." />
    <link rel="canonical" href="https://jlpt.sureshsurkheti.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JLPT Practice" />
    <meta property="og:title" content="JLPT Practice — Free Mock Exams for N1, N2, N3, N4 and N5" />
    <meta property="og:description" content="Free JLPT mock exams with a timer, automatic marking, answer explanations and listening scripts. Practise vocabulary, grammar, reading and listening from N5 up to N1." />
    <meta property="og:url" content="https://jlpt.sureshsurkheti.com/" />
    <meta property="og:image" content="https://jlpt.sureshsurkheti.com/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JLPT Practice — Free Mock Exams for N1, N2, N3, N4 and N5" />
    <meta name="twitter:description" content="Free JLPT mock exams with a timer, automatic marking, answer explanations and listening scripts. Practise vocabulary, grammar, reading and listening from N5 up to N1." />
    <meta name="twitter:image" content="https://jlpt.sureshsurkheti.com/icon-512.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "JLPT Practice",
      "url": "https://jlpt.sureshsurkheti.com/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "description": "Free JLPT mock exams with a timer, automatic marking, answer explanations and listening scripts. Practise vocabulary, grammar, reading and listening from N5 up to N1.",
      "inLanguage": ["en", "ja", "vi", "ne", "id", "fil", "si", "hi", "pt-BR", "zh", "ko", "bn"],
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="home-page">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand-wrap" href="index.html" id="brandLink">
          <span class="brand-mark">JL</span>
          <span class="brand-text">
            <span class="brand-name">JLPT Practice</span>
            <span class="brand-tag" data-i18n="tag.home"></span>
          </span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html" class="active" data-i18n="nav.home">Home</a>
          <a href="levels.html" data-i18n="nav.levels">Levels</a>
          <a href="exams.html" data-i18n="nav.exams">Exams</a>
          <a href="study.html" data-i18n="nav.study">Study</a>
          <a href="about.html" data-i18n="nav.about">About</a>
          <a class="nav-guides" href="/guide/">Guides</a>
        </nav>

        <div class="nav-tools">
          <label class="language-select">
            <span data-i18n="lang.label">Language</span>
            <select id="languageSelect">
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ne">नेपाली</option>
              <option value="vi">Tiếng Việt</option>
              <option value="id">Bahasa Indonesia</option>
              <option value="fil">Filipino</option>
              <option value="si">සිංහල</option>
              <option value="hi">हिन्दी</option>
              <option value="pt-BR">Português (Brasil)</option>
              <option value="zh">中文</option>
              <option value="ko">한국어</option>
              <option value="bn">বাংলা</option>
            </select>
          </label>
          <!-- A "Start studying" button used to sit here. It was the third
               link to the same place on this page - the nav has Levels a few
               pixels to its left, and the hero below it has "View all levels"
               plus five per-level shortcuts - and it was the only one that
               guessed your level, hard-coded to N5, which is wrong for
               anyone who is not a beginner. -->
        </div>
      </div>
    </header>

    <main>
      <section class="hero-section">
        <div class="container hero-grid">
          <div class="hero-copy">
            <h1 data-i18n="home.title"></h1>
            <p data-i18n="home.body"></p>
            <!-- Computed from the first-Sunday rule in site.js, not from a
                 table, so it cannot go stale. -->
            <div class="hero-countdown" id="examCountdown"></div>

            <div class="hero-actions">
              <a href="exams.html" class="btn btn-primary" data-i18n="home.browseExams"></a>
              <a href="levels.html" class="btn btn-secondary" data-i18n="home.viewAllLevels"></a>
            </div>
          </div>

          <!-- A "Your progress" panel used to sit here, reading 0, 0 / 5 and
               0% for every visitor on every visit because nothing ever wrote
               to the store behind it. What belongs beside the pitch is the
               next thing to do, not a scoreboard of zeroes: five real links
               that skip the library and open one level's papers directly.
               Written in the markup rather than built in JS, so they are
               five crawlable internal links as well as a shortcut. -->
          <nav class="hero-levels" aria-labelledby="heroLevelsHead">
            <div class="hero-levels-head" id="heroLevelsHead"
                 data-i18n="home.pickLevel"></div>
            <a class="hero-level" href="exams.html?lv=N5">
              <b>N5</b><span data-i18n="level.N5"></span>
              <i aria-hidden="true">&rarr;</i></a>
            <a class="hero-level" href="exams.html?lv=N4">
              <b>N4</b><span data-i18n="level.N4"></span>
              <i aria-hidden="true">&rarr;</i></a>
            <a class="hero-level" href="exams.html?lv=N3">
              <b>N3</b><span data-i18n="level.N3"></span>
              <i aria-hidden="true">&rarr;</i></a>
            <a class="hero-level" href="exams.html?lv=N2">
              <b>N2</b><span data-i18n="level.N2"></span>
              <i aria-hidden="true">&rarr;</i></a>
            <a class="hero-level" href="exams.html?lv=N1">
              <b>N1</b><span data-i18n="level.N1"></span>
              <i aria-hidden="true">&rarr;</i></a>
          </nav>
        </div>
      </section>

      <!-- Filled by renderFeatures() from SITE_COUNTS, which the generator
           writes from the data files. -->
      <section class="container features-section">
        <div class="section-header">
          <h2 data-i18n="home.featuresTitle"></h2>
          <p data-i18n="home.featuresBody"></p>
        </div>
        <div class="feature-stat-grid" id="featureGrid"></div>
      </section>

      <section class="container notice-section">
        <div class="notice-card" id="noticeCard">
          <div class="notice-head">
            <h2 data-i18n="notice.title"></h2>
            <p data-i18n="notice.intro"></p>
          </div>
          <div class="notice-table-wrap">
            <table class="notice-table" id="noticeTable"></table>
          </div>
          <p class="notice-words" id="noticeWords" hidden></p>

          <details class="notice-more">
            <summary data-i18n="notice.moreLabel"></summary>
            <div class="notice-foot" id="noticeFoot"></div>
          </details>
        </div>
      </section>

      <section class="container level-section">
        <div class="section-header level-header-row">
          <div>
            <h2 data-i18n="home.chooseLevel"></h2>
            <p data-i18n="home.chooseLevelBody"></p>
          </div>
          <a href="levels.html" class="text-link" data-i18n="home.viewAllLevels"></a>
        </div>

        <div class="level-grid">
          <a class="level-card level-n5" href="levels.html?lv=N5">
            <span class="level-code">N5</span>
            <span class="level-desc" data-i18n="level.N5"></span>
          </a>
          <a class="level-card level-n4" href="levels.html?lv=N4">
            <span class="level-code">N4</span>
            <span class="level-desc" data-i18n="level.N4"></span>
          </a>
          <a class="level-card level-n3" href="levels.html?lv=N3">
            <span class="level-code">N3</span>
            <span class="level-desc" data-i18n="level.N3"></span>
          </a>
          <a class="level-card level-n2" href="levels.html?lv=N2">
            <span class="level-code">N2</span>
            <span class="level-desc" data-i18n="level.N2"></span>
          </a>
          <a class="level-card level-n1" href="levels.html?lv=N1">
            <span class="level-code">N1</span>
            <span class="level-desc" data-i18n="level.N1"></span>
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>© 2026 Suresh Surkheti</div>
        <div data-i18n="footer.tagline">Study smarter. Live better in Japan.</div>
      </div>
    </footer>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/i18n/en.js"></script>
    <script src="assets/js/site.js"></script>
  </body>
</html>
