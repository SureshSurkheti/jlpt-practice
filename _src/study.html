      <section class="page-intro">
        <h1 data-i18n="study.title"></h1>
        <p data-i18n="study.body"></p>
        <!-- A line, not a panel. As three cards between the coverage table
             and the tabs it split one task into two halves with something
             unrelated in the middle; here it is reachable without scrolling
             and interrupts nothing. English only, and it says so. -->
        <p class="intro-guides">
          <span data-i18n="guides.lead">New to the JLPT?</span>
          <a href="/guide/jlpt-scoring.html">How scoring works</a>
          <a href="/guide/n4-to-n3.html">N4 to N3</a>
          <a href="/guide/which-jlpt-level.html">Which level to take</a>
          <em data-i18n="guides.english">These guides are in English only.</em>
        </p>
      </section>

      <!-- Filled in by tools/build_static.py: the counts come from the data
           files, so they are written into the markup rather than fetched. -->
      <div id="studyCoverage"></div>


      <div class="study-controls">
        <div class="study-tabs" role="tablist">
          <button type="button" class="study-tab is-on" data-level="N5" role="tab">N5</button>
          <button type="button" class="study-tab" data-level="N4" role="tab">N4</button>
          <button type="button" class="study-tab" data-level="N3" role="tab">N3</button>
          <button type="button" class="study-tab" data-level="N2" role="tab">N2</button>
          <button type="button" class="study-tab" data-level="N1" role="tab">N1</button>
        </div>
        <div class="study-tabs study-kind" role="tablist">
          <button type="button" class="study-tab is-on" data-kind="words" role="tab"
                  data-i18n="study.words"></button>
          <button type="button" class="study-tab" data-kind="kanji" role="tab"
                  data-i18n="study.kanji"></button>
          <button type="button" class="study-tab" data-kind="grammar" role="tab"
                  data-i18n="study.grammar"></button>
        </div>
        <input type="search" class="study-search" id="studySearch"
               data-i18n-attr="placeholder:study.search,aria-label:study.search" />
      </div>

      <div id="studyContent" aria-live="polite"></div>
