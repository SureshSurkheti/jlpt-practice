<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#112d4e" />
    <title>JLPT Mock Exam Library — 84 Full-Length Practice Papers</title>
    <meta name="description" content="Browse 84 full-length JLPT practice papers from N1 to N4. Every paper is timed, marked automatically, and comes with answer explanations and listening scripts." />
    <link rel="canonical" href="https://jlpt.sureshsurkheti.com/exams.html" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JLPT Practice" />
    <meta property="og:title" content="JLPT Mock Exam Library — 84 Full-Length Practice Papers" />
    <meta property="og:description" content="Browse 84 full-length JLPT practice papers from N1 to N4. Every paper is timed, marked automatically, and comes with answer explanations and listening scripts." />
    <meta property="og:url" content="https://jlpt.sureshsurkheti.com/exams.html" />
    <meta property="og:image" content="https://jlpt.sureshsurkheti.com/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JLPT Mock Exam Library — 84 Full-Length Practice Papers" />
    <meta name="twitter:description" content="Browse 84 full-length JLPT practice papers from N1 to N4. Every paper is timed, marked automatically, and comes with answer explanations and listening scripts." />
    <meta name="twitter:image" content="https://jlpt.sureshsurkheti.com/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/exam.css" />
  </head>
  <body class="exams-page">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand-wrap" href="index.html" id="brandLink">
          <span class="brand-mark">JL</span>
          <span class="brand-text">
            <span class="brand-name">JLPT Practice</span>
            <span class="brand-tag" data-i18n="tag.exams"></span>
          </span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html" data-i18n="nav.home">Home</a>
          <a href="levels.html" data-i18n="nav.levels">Levels</a>
          <a href="exams.html" class="active" data-i18n="nav.exams">Exams</a>
          <a href="study.html" data-i18n="nav.study">Study</a>
          <a href="about.html" data-i18n="nav.about">About</a>
        </nav>

        <div class="nav-tools">
          <label class="language-select">
            <span data-i18n="lang.label">Language</span>
            <select id="languageSelect">
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ne">नेपाली</option>
              <option value="vi">Tiếng Việt</option>
              <option value="id">Bahasa Indonesia</option>
              <option value="fil">Filipino</option>
              <option value="si">සිංහල</option>
              <option value="hi">हिन्दी</option>
              <option value="pt-BR">Português (Brasil)</option>
              <option value="zh">中文</option>
              <option value="ko">한국어</option>
              <option value="bn">বাংলা</option>
            </select>
          </label>
        </div>
      </div>
    </header>

    <main class="exams-root">
      <div class="container">
        <section class="exams-hero">
          <h1 data-i18n="exams.title"></h1>
          <p data-i18n="exams.body"></p>
          <div class="exams-stats" id="examsStats"></div>
        </section>

        <!-- Levels first. The filter row only appears once a level is
             open, because until then it has nothing to filter. -->
        <div class="exams-filters" id="examsFilters" hidden>
          <button type="button" class="chip-back" id="examsBack">
            <span aria-hidden="true">&larr;</span>
            <span data-i18n="exams.allLevels"></span>
          </button>
          <button type="button" class="chip" data-level="N5" aria-pressed="false">N5</button>
          <button type="button" class="chip" data-level="N4" aria-pressed="false">N4</button>
          <button type="button" class="chip" data-level="N3" aria-pressed="false">N3</button>
          <button type="button" class="chip" data-level="N2" aria-pressed="false">N2</button>
          <button type="button" class="chip" data-level="N1" aria-pressed="false">N1</button>
        </div>

        <div class="exams-searchrow">
          <input
            type="search"
            class="exams-search"
            id="examsSearch"
            data-i18n-attr="placeholder:exams.search,aria-label:exams.search"
            aria-label="Search exams"
          />
        </div>

        <div id="examsList">
          <div class="exam-loading">
            <div class="spinner" aria-hidden="true"></div>
            <p data-i18n="exams.loading"></p>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>© 2026 Suresh Surkheti</div>
        <div data-i18n="footer.tagline">Study smarter. Live better in Japan.</div>
      </div>
    </footer>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/i18n-strings.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/exams-browser.js"></script>
  </body>
</html>
