<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#112d4e" />
    <title>Your JLPT Progress — JLPT Practice</title>
    <meta name="description" content="Your accuracy and activity for each JLPT level you have studied." />
    <meta name="robots" content="noindex, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JLPT Practice" />
    <meta property="og:title" content="Your JLPT Progress — JLPT Practice" />
    <meta property="og:description" content="Your accuracy and activity for each JLPT level you have studied." />
    <meta property="og:url" content="https://jlpt.sureshsurkheti.com/stats.html" />
    <meta property="og:image" content="https://jlpt.sureshsurkheti.com/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your JLPT Progress — JLPT Practice" />
    <meta name="twitter:description" content="Your accuracy and activity for each JLPT level you have studied." />
    <meta name="twitter:image" content="https://jlpt.sureshsurkheti.com/icon-512.png" />
    <link rel="preload" href="assets/fonts/inter-v20-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/cormorant-v21-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      /* Stats page only. Everything shared with the rest of the site lives in
         styles.css; these are the four blocks unique to this page. */

      /* Three cards, so auto-fit rather than a fixed four-column track that
         left a hole on the right. They sit on the light page background, not
         on a hero, so they are panels like every other card on the site. */
      .stats-grid-4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: clamp(12px, 1.2vw, 18px);
        margin-top: clamp(18px, 2vw, 28px);
      }

      .big-stat-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: var(--card-pad);
        display: grid;
        gap: 10px;
        box-shadow: 0 10px 24px rgba(17, 45, 78, 0.04);
      }

      .big-stat-label {
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--muted);
      }

      .big-stat-number {
        font-size: clamp(2rem, 2.4vw, 2.6rem);
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--navy);
        line-height: 1;
        font-variant-numeric: lining-nums tabular-nums;
      }

      .section-performance {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: clamp(18px, 1.8vw, 26px);
        box-shadow: 0 10px 24px rgba(17, 45, 78, 0.04);
      }

      .section-performance h2 {
        margin: 0 0 18px;
        color: var(--navy);
        font-size: clamp(1.3rem, 1.6vw, 1.6rem);
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body class="stats-page" data-back-to="index.html">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand-wrap" href="index.html" id="brandLink">
          <span class="brand-mark">JL</span>
          <span class="brand-text">
            <span class="brand-name">JLPT Practice</span>
            <span class="brand-tag" data-i18n="tag.stats"></span>
          </span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html" data-i18n="nav.home">Home</a>
          <a href="levels.html" data-i18n="nav.levels">Levels</a>
          <a href="exams.html" data-i18n="nav.exams">Exams</a>
          <a href="study.html" data-i18n="nav.study">Study</a>
          <a href="about.html" data-i18n="nav.about">About</a>
          <a class="nav-guides" href="/guide/" data-i18n="nav.guides">Guides</a>
        </nav>

        <div class="nav-tools">
          <label class="language-select">
            <span data-i18n="lang.label">Language</span>
            <select id="languageSelect" aria-label="Language" data-i18n-attr="aria-label:lang.label">
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ne">नेपाली</option>
              <option value="vi">Tiếng Việt</option>
              <option value="id">Bahasa Indonesia</option>
              <option value="fil">Filipino</option>
              <option value="si">සිංහල</option>
              <option value="hi">हिन्दी</option>
              <option value="pt-BR">Português (Brasil)</option>
              <option value="zh">中文</option>
              <option value="ko">한국어</option>
              <option value="bn">বাংলা</option>
            </select>
          </label>
        </div>
      </div>
    </header>

    <main class="container page-shell">
      <section class="page-intro">
        <h1 data-i18n="stats.title"></h1>
        <p data-i18n="stats.body"></p>
      </section>

      <div class="stats-grid-4">
        <div class="big-stat-card">
          <div class="big-stat-label" data-i18n="stats.papersSat"></div>
          <div class="big-stat-number" id="totalAnswered">0</div>
        </div>
        <div class="big-stat-card">
          <div class="big-stat-label" data-i18n="stats.ofScale"></div>
          <div class="big-stat-number" id="overallAccuracy">0%</div>
        </div>
        <div class="big-stat-card">
          <div class="big-stat-label" data-i18n="stats.levelsTouched"></div>
          <div class="big-stat-number" id="levelsProgressed">0 / 5</div>
        </div>
      </div>

      <!-- The notebook of wrong answers the exam player keeps. Counted here
           because this is the page about what you have done; the review
           itself has a page of its own. -->
      <section class="stats-mistakes" id="statsMistakes">
        <div>
          <h2 data-i18n="stats.mistakesTitle"></h2>
          <p data-i18n="stats.mistakesBody"></p>
          <p class="stats-mistakes-count" id="mistakesCount"></p>
        </div>
        <a class="btn btn-primary" href="review.html" id="mistakesOpen" data-i18n="stats.mistakesOpen" hidden></a>
      </section>

      <!-- The ✓ / ✗ marks from the word lists (jlpt.know), one line per
           level that has any. -->
      <section class="stats-mistakes stats-know" id="statsKnow">
        <div>
          <h2 data-i18n="stats.knowTitle"></h2>
          <p data-i18n="stats.knowBody"></p>
          <p class="stats-mistakes-count" id="knowSummary"></p>
          <ul class="stats-know-list" id="knowList" hidden></ul>
        </div>
        <a class="btn btn-ghost" href="study.html" data-i18n="stats.knowOpen"></a>
      </section>

      <section id="levelProgressSection" class="level-progress-grid"></section>

      <section class="section-performance">
        <h2 data-i18n="exam.breakdown"></h2>
        <div class="section-score-grid" id="sectionPerformanceGrid"></div>
      </section>

      <!-- Scores live in this browser and nowhere else, which is private but
           also means they do not follow you to another device, and that a
           browser two people share shows one set of numbers to both. These
           three controls are the answer that needs no account and no server:
           carry them to another device as a file, and clear them when the
           machine is not yours. -->
      <section class="stats-data">
        <h2 data-i18n="stats.dataTitle"></h2>
        <p data-i18n="stats.dataBody"></p>
        <div class="stats-data-actions">
          <button type="button" class="btn btn-ghost" id="exportScores"
                  data-i18n="stats.export"></button>
          <label class="btn btn-ghost stats-import">
            <span data-i18n="stats.import"></span>
            <input type="file" id="importScores" accept="application/json,.json" />
          </label>
          <button type="button" class="btn btn-ghost is-danger" id="clearScores"
                  data-i18n="stats.clear"></button>
        </div>
        <p class="stats-data-msg" id="statsDataMsg" role="status"></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>© 2026 JLPT Practice</div>
        <div data-i18n="footer.tagline">Study smarter. Live better in Japan.</div>
      </div>
      <nav class="container footer-links" aria-label="Your study">
        <a href="quiz.html" data-i18n="quiz.title">Quiz yourself</a>
        <a href="stats.html" data-i18n="stats.title">Your progress</a>
        <a href="review.html" data-i18n="review.title">Mistake notebook</a>
      </nav>
    </footer>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/i18n/en.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/stats.js"></script>
  </body>
</html>
