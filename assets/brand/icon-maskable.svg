<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="JLPT Practice">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#0f2c4c"/>
      <stop offset="0.52" stop-color="#1d5490"/>
      <stop offset="1" stop-color="#2f74bd"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.12" r="0.92">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <!-- The two glyphs together span 128-430 across and 128-398 down, so the
         pair is nudged to sit on the tile's real centre. -->
    <g transform="translate(-23 -7) translate(256 256) scale(0.94) translate(-256 -256)">
    <!-- JL, drawn as geometry rather than type so it rasterises identically
         wherever this is built. J: a stem with a hook; L: a stem with a foot.
         Both 46 units thick, both sitting on the same baseline. -->
    <path d="M236 128 H282 V330 a68 68 0 0 1 -68 68 h-14 a68 68 0 0 1 -68 -68 v-18 h46 v18
             a22 22 0 0 0 22 22 h14 a22 22 0 0 0 22 -22 Z" fill="#ffffff"/>
    <path d="M312 128 H358 V352 H430 V398 H312 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
